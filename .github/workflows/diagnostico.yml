name: diagnostico
on:
  push:
    branches: ['claude/**']
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Pagina no ar
        run: curl -sS -o /dev/null -w "pagina HTTP %{http_code}\n" https://leaderei.github.io/pagina-aplicacao/servan/indicacao/
      - name: POST de teste (igual ao formulario)
        env:
          URL: https://script.google.com/macros/s/AKfycbweRllh4dYWvUQdYqBitd1mqfgvUgN57IZCG9IzhG-TDoAoUFZmK3RdpVadXjXfFO03Sw/exec
        run: |
          curl -sS -L -i -H "Origin: https://leaderei.github.io" \
            --data-urlencode "ind_nome=TESTE CLAUDE (apagar)" \
            --data-urlencode "ind_vinculo=Colaborador(a)" \
            --data-urlencode "nome=TESTE CLAUDE (apagar)" \
            --data-urlencode "whatsapp=(67) 99999-0000" \
            --data-urlencode "motivo=teste automatico de integracao" \
            --data-urlencode "sabe=Sim" --data-urlencode "consentimento=Sim" \
            "$URL" | grep -iE "^HTTP|^location|access-control|^content-type|ok|erro|<title" | cut -c1-200
