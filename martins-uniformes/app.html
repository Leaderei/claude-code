<title>Martins Chão de Fábrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Um só visual, claro e de alto contraste, escolhido de propósito para leitura fácil. */
:root{
  color-scheme:light;
  --bg:#EEF1F5;--card:#FFFFFF;--ink:#16202C;--ink2:#434D59;--muted:#687280;--line:#D6DCE3;
  --go:#17864A;--go-dark:#0E6A38;--go-soft:#E2F3E9;
  --atn:#E8A200;--atn-ink:#5A3E00;--atn-soft:#FFF3D1;
  --red:#C9352A;--red-soft:#FCE4E1;
  --blue:#1E5BB8;--blue-soft:#E3ECFA;
  --grey-soft:#E9ECF0;
  --font:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:19px/1.4 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
svg.ic{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* topo */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:14px}
.ola{margin-right:auto}
.ola b{display:block;font-size:30px;line-height:1.1}
.ola span{color:var(--muted);font-size:18px}
.help{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px;font-weight:700}

/* navegação inferior */
main{padding-block:20px 150px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(22,32,44,.06)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-block:10px}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;border-radius:16px;background:none;padding:10px 6px;font-weight:700;font-size:18px;color:var(--ink2)}
.nb svg.ic{width:34px;height:34px}
.nb[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.nb.novo{background:var(--go);color:#fff}
.nb.novo[aria-current="page"]{background:var(--go-dark);color:#fff}

h1{font-size:30px;line-height:1.15;margin:0 0 14px;text-wrap:balance}
h2{font-size:24px;margin:0 0 10px;text-wrap:balance}

/* resumo no topo da equipe */
.resumo{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.rs{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:10px 16px;font-weight:700;font-size:18px}
.rs b{font-size:26px}
.dot{width:16px;height:16px;border-radius:50%;flex:none;background:currentColor}
.u-crit{background:var(--red-soft);color:var(--red)}
.u-warn{background:var(--atn-soft);color:var(--atn-ink)}
.u-ok{background:var(--go-soft);color:var(--go-dark)}
.u-pronto{background:var(--blue-soft);color:var(--blue)}
.u-fim{background:var(--grey-soft);color:var(--muted)}
.u-warn .dot{background:var(--atn)}

/* equipe */
.setor{margin-bottom:26px}
.setor-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.setor-h svg.ic{width:30px;height:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pessoa{display:grid;grid-template-rows:1fr auto auto;border:2px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden;min-height:190px}
.p-open{display:grid;grid-template-rows:auto 1fr;text-align:left;border:0;background:none;padding:0}
.pessoa:hover{border-color:var(--ink2)}
.p-body .emp{display:flex;align-items:center;gap:5px;color:var(--ink);font-weight:700;font-size:16px;margin-top:2px}
.p-body .emp svg.ic{width:19px;height:19px;color:var(--muted)}
.p-body .prox{display:block;color:var(--atn-ink);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.p-act{display:flex;align-items:center;justify-content:center;gap:10px;border:0;margin:0 12px 12px;border-radius:14px;min-height:58px;font-size:21px;font-weight:700;color:#fff}
.p-act svg.ic{width:28px;height:28px;stroke-width:3.8}
.p-act.ini{background:var(--blue)}.p-act.ini:hover{background:#174A96}
.p-act.fim{background:var(--go)}.p-act.fim:hover{background:var(--go-dark)}
.st-trab .p-st,.st-livre .p-st,.st-nada .p-st{margin-bottom:12px}
.p-top{display:flex;align-items:center;gap:12px;padding:14px 14px 8px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;flex:none}
.p-top b{display:block;font-size:22px;line-height:1.1}
.p-top small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:16px}
.p-top small svg.ic{width:20px;height:20px}
.p-body{display:flex;align-items:center;gap:12px;padding:4px 14px 12px}
.p-body svg.prod{width:64px;height:64px;flex:none}
.p-body b{display:block;font-size:19px;line-height:1.2}
.p-body span{color:var(--ink2);font-size:17px}
.p-body .vazio{color:var(--muted);font-size:17px}
.p-st{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:17px}
.st-trab .p-st{background:var(--go-soft);color:var(--go-dark)}
.st-livre{border-color:var(--atn)}
.st-livre .p-st{background:var(--atn);color:#2B1D00}
.st-livre .p-st .dot{background:#2B1D00}
.st-nada .p-st{background:var(--grey-soft);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.st-livre .p-st .dot{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}

/* pedidos */
.peds{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.ped{display:grid;gap:10px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:0 0 16px;overflow:hidden}
.ped:hover{border-color:var(--ink2)}
.ped-st{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.ped h3{margin:0;padding-inline:16px;font-size:24px;line-height:1.15}
.ped-ent{display:flex;align-items:center;gap:8px;padding-inline:16px;color:var(--ink2);font-size:18px}
.ped-prods{display:flex;flex-wrap:wrap;gap:12px;padding-inline:16px}
.pp{display:grid;justify-items:center;gap:4px;width:92px}
.pp svg.prod{width:72px;height:72px}
.pp b{font-size:18px}
.barra{height:10px;width:100%;border-radius:5px;background:var(--grey-soft);overflow:hidden}
.barra i{display:block;height:100%;background:var(--go);border-radius:0 5px 5px 0}
.falta{margin-inline:16px;display:flex;align-items:center;gap:8px;background:var(--atn-soft);color:var(--atn-ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:17px}

/* telas cheias (folhas) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{max-width:780px;padding-block:14px}
.sheet.largo .wrap{max-width:1180px}
@media (max-width:560px){.nb{font-size:15px}.nb svg.ic{width:28px;height:28px}}
/* mapa de etapas */
.fx-wrap{overflow-x:auto;padding:8px 4px 14px;margin-top:10px;-webkit-overflow-scrolling:touch}
.fx{position:relative}
.fx-lines{position:absolute;left:0;top:0;overflow:visible}
.fx-lines path.e{fill:none;stroke:#A9B3BF;stroke-width:2.5}
.fx-lines path.e.on{stroke:var(--go)}
.fx-lines path.e.hi{stroke:var(--blue);stroke-width:4}
.fx-lines path.e.dim{opacity:.12}
.nd{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;overflow:hidden}
.nd:hover{border-color:var(--ink2)}
.nd-h{display:flex;gap:6px;align-items:flex-start;font-size:16px;line-height:1.15;font-weight:700}
.nd-h svg.ic{width:22px;height:22px}
.nd-m{font-size:14px;color:var(--muted);padding-left:28px}
.nd-s{font-size:14px;font-weight:700;margin-top:auto;display:flex;gap:5px;align-items:center;line-height:1.15}
.nd-s svg.ic{width:18px;height:18px}
.nd.st-ok{background:var(--go-soft);border-color:var(--go)}.nd.st-ok .nd-s{color:var(--go-dark)}
.nd.st-and{background:var(--blue-soft);border:3px solid var(--blue)}.nd.st-and .nd-s{color:var(--blue)}
.nd.st-ready{border:3px solid var(--ink)}.nd.st-ready .nd-s{color:var(--ink)}
.nd.st-pend{background:#F5F6F8;border-style:dashed}.nd.st-pend .nd-s{color:var(--muted);font-weight:400}
.nd.f-pers{background:var(--atn-soft);border-color:var(--atn)}
.nd.f-antes .nd-s{color:var(--go-dark)}
.nd.f-depois .nd-s{color:var(--ink2);font-weight:400}
.nd.dim{opacity:.25}
.nd.sel{box-shadow:0 0 0 4px var(--blue)}
.fx-info{display:grid;gap:10px;background:var(--blue-soft);border-radius:16px;padding:16px;margin-top:4px;font-size:18px}
.fx-info .t{display:flex;align-items:center;gap:8px;font-size:23px;font-weight:700}
.fx-info .t svg.ic{width:30px;height:30px}
.fx-info .lin{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagp{background:var(--card);border-radius:10px;padding:3px 10px;font-weight:700;font-size:16px;border:2px solid var(--line)}
.arraste{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:16px}
.legenda{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:16px;color:var(--ink2);margin:6px 0 2px}
.legenda span{display:inline-flex;align-items:center;gap:7px}
.legenda i{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-block;background:var(--card)}
.prodbloco{padding:16px 0;border-top:2px solid var(--grey-soft)}
.prodbloco:first-of-type{border-top:0;padding-top:4px}
.prodbloco .prodline{border-top:0;padding:0}
/* produtos */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.prodc{display:grid;justify-items:center;gap:6px;text-align:center;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:18px}
.prodc:hover{border-color:var(--ink2)}
.prodc svg.prod{width:130px;height:130px}
.prodc b{font-size:22px}
.prodc span{color:var(--ink2);font-size:17px}
.prodc.add{border-style:dashed;color:var(--go-dark);align-content:center}
.prodc.add svg.ic{width:64px;height:64px}
.linha-dep{display:flex;flex-wrap:wrap;gap:8px}
.depc{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;font-size:17px}
.depc svg.ic{width:22px;height:22px}
.depc[aria-pressed="true"]{border-color:var(--go);background:var(--go-soft);color:var(--go-dark)}
.rotulo{color:var(--ink2);font-weight:700;font-size:19px;margin:22px 0 8px}
.x.azul{color:var(--blue)}
.voltar{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 20px 12px 14px;font-weight:700;font-size:20px;margin-bottom:18px}
.voltar svg.ic{width:28px;height:28px}
.quem{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.quem .av{width:64px;height:64px;font-size:30px}
.quem b{display:block;font-size:30px;line-height:1.1}
.quem div span{color:var(--muted);font-size:19px}
.tarefa{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.tarefa.sug{border-color:var(--ink)}
.tarefa svg.prod{width:150px;height:150px}
.tarefa .etapa{font-size:36px;font-weight:700;line-height:1.05;text-transform:uppercase}
.tarefa .qtd{font-size:26px;font-weight:700;margin-top:6px}
.tarefa .desc{color:var(--ink2);font-size:19px}
.tarefa .para{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
@media (max-width:560px){.tarefa{grid-template-columns:1fr;justify-items:start}.tarefa svg.prod{width:110px;height:110px}.tarefa .etapa{font-size:30px}}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 13px;font-weight:700;font-size:16px}
.pill svg.ic{width:20px;height:20px}
.pill.adi{background:var(--blue-soft);color:var(--blue)}
.pill.cons{background:var(--red-soft);color:var(--red)}
.instr{display:flex;gap:12px;align-items:flex-start;background:var(--atn-soft);border:2px solid var(--atn);color:var(--atn-ink);border-radius:16px;padding:14px 16px;font-size:20px;font-weight:700;margin-top:14px}
.instr svg.ic{width:32px;height:32px}
.acoes{display:grid;gap:12px;margin-top:20px}
.big{display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:18px;min-height:78px;padding:14px 22px;font-size:26px;font-weight:700}
.big svg.ic{width:36px;height:36px;stroke-width:3.6}
.big.go{background:var(--go);color:#fff}
.big.go:hover{background:var(--go-dark)}
.big.prob{background:var(--card);color:var(--red);border:3px solid var(--red);min-height:66px;font-size:22px}
.big.neutro{background:var(--card);color:var(--ink2);border:2px solid var(--line);min-height:62px;font-size:21px}
.big.azul{background:var(--blue);color:#fff}
.big.go.ini{background:var(--blue)}
.big:disabled{opacity:.4;cursor:not-allowed}
.outras{display:grid;gap:10px;margin-top:10px}
.outra{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 14px}
.outra svg.prod{width:64px;height:64px}
.outra b{display:block;font-size:20px}
.outra span{color:var(--ink2);font-size:17px}
.outra .ir{font-weight:700;color:var(--go-dark);display:flex;align-items:center;gap:4px}
.feito{display:grid;justify-items:center;text-align:center;gap:8px;padding:10px 0 20px}
.feito .ok{width:110px;height:110px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center}
.feito .ok svg.ic{width:66px;height:66px;stroke-width:4.5}
@media (prefers-reduced-motion:no-preference){.feito .ok{animation:pop .35s ease-out}}
@keyframes pop{from{transform:scale(.6);opacity:.3}}
.feito b{font-size:30px}
.feito span{font-size:20px;color:var(--ink2)}
.vazio-box{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:26px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--ink2);font-size:20px}
.vazio-box svg.ic{width:60px;height:60px;color:var(--muted)}

/* pedido detalhe */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.ped-head{display:grid;gap:8px}
.ped-head h1{margin:0}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chk{display:grid;justify-items:center;gap:8px;text-align:center;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:16px 10px;font-weight:700;font-size:19px}
.chk svg.ic{width:44px;height:44px}
.chk .box{width:34px;height:34px;border-radius:9px;border:3px solid var(--muted);display:grid;place-items:center}
.chk .box svg.ic{width:24px;height:24px;stroke-width:4.5;visibility:hidden}
.chk[aria-pressed="true"]{border-color:var(--go);background:var(--go-soft);color:var(--go-dark)}
.chk[aria-pressed="true"] .box{background:var(--go);border-color:var(--go);color:#fff}
.chk[aria-pressed="true"] .box svg.ic{visibility:visible}
.mat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:2px solid var(--grey-soft)}
.mat svg.ic{width:34px;height:34px;color:var(--atn-ink)}
.mat b{display:block;font-size:19px}
.mat span{color:var(--ink2);font-size:17px}
.mbtn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:18px;background:var(--blue);color:#fff}
.lib{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px 16px;font-weight:700;font-size:21px;margin-top:14px}
.lib svg.ic{width:34px;height:34px}
.prodline{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-top:2px solid var(--grey-soft)}
.prodline:first-of-type{border-top:0}
.prodline svg.prod{width:110px;height:110px}
.prodline h3{margin:0;font-size:22px}
.prodline .agora{font-size:18px;color:var(--ink2);margin-top:4px}
.trilha{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tp{display:grid;justify-items:center;gap:4px;width:88px;text-align:center;font-size:15px;font-weight:700;color:var(--muted)}
.tc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);background:var(--card)}
.tc svg.ic{width:28px;height:28px}
.tp.ok{color:var(--go-dark)}.tp.ok .tc{background:var(--go);border-color:var(--go);color:#fff}
.tp.and{color:var(--blue)}.tp.and .tc{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.tp small{font-weight:400;font-size:14px;color:var(--ink2)}
@media (max-width:560px){.prodline{grid-template-columns:1fr}.tp{width:70px}}

/* novo pedido */
.passos{display:flex;gap:8px;margin-bottom:18px}
.passos i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.passos i.on{background:var(--go)}
.passo-n{color:var(--muted);font-weight:700;font-size:18px;margin-bottom:4px}
.campo{width:100%;font:inherit;font-size:26px;padding:16px 18px;border:3px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
.campo:focus{border-color:var(--blue);outline:none}
.escolhe{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.opc{display:grid;justify-items:center;gap:6px;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:14px 10px;font-weight:700;font-size:19px;text-align:center}
.opc svg.prod{width:110px;height:110px}
.opc svg.ic{width:48px;height:48px}
.opc[aria-pressed="true"]{border-color:var(--go);background:var(--go-soft)}
.item{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px;margin-top:14px}
.item-h{display:flex;align-items:center;gap:14px}
.item-h svg.prod{width:80px;height:80px}
.item-h b{font-size:22px;margin-right:auto}
.x{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;color:var(--red)}
.cores{display:flex;flex-wrap:wrap;gap:10px}
.cor{display:grid;justify-items:center;gap:4px;border:0;background:none;font-size:15px;font-weight:700;color:var(--ink2);padding:0}
.cor span{width:50px;height:50px;border-radius:50%;border:3px solid var(--line)}
.cor[aria-pressed="true"] span{box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--go)}
.tams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tam{display:grid;grid-template-columns:38px 54px minmax(56px,1fr) 54px;align-items:center;gap:6px;background:var(--bg);border-radius:14px;padding:6px}
.tam b{font-size:22px;text-align:center}
.tam input{width:100%;min-width:0;text-align:center;font:inherit;font-size:24px;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:6px 0;background:var(--card);color:var(--ink)}
.stp{width:54px;height:54px;border:0;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:30px;font-weight:700;line-height:1}
.datas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.data-op{display:grid;gap:4px;justify-items:start;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:16px;text-align:left}
.data-op b{font-size:24px}
.data-op span{color:var(--ink2);font-size:18px}
.data-op[aria-pressed="true"]{border-color:var(--go);background:var(--go-soft)}
.aviso{display:flex;align-items:center;gap:10px;color:var(--red);font-weight:700;font-size:19px;margin-top:12px}
.nav2{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:22px}
.resumo-item{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:2px solid var(--grey-soft)}
.resumo-item svg.prod{width:64px;height:64px}
.resumo-item b{font-size:20px}

/* problema */
.probs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.probs .opc svg.ic{width:52px;height:52px;color:var(--red)}
.contador{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.contador .stp{width:84px;height:84px;font-size:44px;border-radius:20px}
.contador output{font-size:64px;font-weight:700;min-width:120px;text-align:center}

/* aviso flutuante */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:14px 14px 14px 20px;display:flex;align-items:center;gap:16px;font-size:19px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{border:0;border-radius:12px;background:#fff;color:var(--ink);font-weight:700;padding:10px 16px;font-size:18px;white-space:nowrap}

/* ajuda */
.ajuda{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:10px 0 20px}
.aj{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:10px;justify-items:center;text-align:center}
.aj .n{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:24px}
.aj svg.ic{width:64px;height:64px;color:var(--ink2)}
.aj b{font-size:22px;line-height:1.2}
.exemplo{display:inline-block;background:var(--atn-soft);color:var(--atn-ink);border-radius:8px;padding:2px 10px;font-size:15px;font-weight:700}

#sheet:not(:empty) ~ #toast .toast{top:calc(16px + env(safe-area-inset-top,0px));bottom:auto}
/* v0.5: máquinas, pessoas e terceirizados */
.pulos{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 20px}
.pulo{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:700;font-size:16px;color:var(--ink2);text-decoration:none}
.pulo svg.ic{width:22px;height:22px}
.grupo{margin-bottom:30px;scroll-margin-top:16px}
.grupo-h{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;margin:0 0 12px}
.grupo-h svg.ic{width:34px;height:34px}
.tipo-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;font-size:20px;font-weight:700;color:var(--ink2);margin:16px 0 8px}
.tipo-h small{font-size:16px;font-weight:400;color:var(--muted)}
.tipo-h .esp{font-size:16px;font-weight:700;color:var(--atn-ink);background:var(--atn-soft);border-radius:8px;padding:2px 9px}
.m-top{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.m-ic{width:46px;height:46px;border-radius:12px;background:var(--grey-soft);display:grid;place-items:center;flex:none}
.m-ic svg.ic{width:30px;height:30px}
.m-top b{font-size:21px;line-height:1.1}
.quem-l{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-top:4px}
.av.s{width:30px;height:30px;font-size:15px}
.st-semp{border-color:var(--red)}

.estrela{color:#C98A00}
.livres{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:22px}
.livres .t{font-weight:700;color:var(--ink2);margin-right:4px}
.pchip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;font-size:17px}

.esc{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}

.escp-h span{color:var(--muted);font-size:16px}

.tar b{display:block;font-size:18px;line-height:1.2}
.tar span{font-size:15px;color:var(--ink2)}
.tar .mbtn{padding:10px 14px;font-size:17px}
.mbtn.go{background:var(--go)}
.vazio-s{color:var(--muted);font-size:17px;padding:8px 0}
.nd.st-fora{background:#F3ECFB;border:3px solid #7A3E9D}.nd.st-fora .nd-s{color:#6B2F8C}
.nd.f-ext{background:#F3ECFB;border-color:#B48ACB}.nd.f-ext .nd-s{color:#6B2F8C}
.tp.fora{color:#6B2F8C}.tp.fora .tc{background:#F3ECFB;border-color:#7A3E9D;color:#6B2F8C}
.subtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.subtab{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px;font-weight:700;font-size:18px}
.subtab svg.ic{width:26px;height:26px}
.subtab[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cad-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.cad-row .m-ic{width:52px;height:52px}
.cad-row b{display:block;font-size:20px}
.cad-row span{font-size:16px;color:var(--ink2)}
.qtdbox{display:flex;align-items:center;gap:8px}
.qtdbox output{font-size:28px;font-weight:700;min-width:36px;text-align:center}
.pes{display:grid;justify-items:start;gap:8px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.pes:hover{border-color:var(--ink2)}
.pes-h{display:flex;align-items:center;gap:12px}
.pes-h b{display:block;font-size:22px}
.pes-h span{color:var(--muted);font-size:16px}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.sk{display:inline-flex;align-items:center;gap:4px;background:var(--grey-soft);border-radius:8px;padding:3px 9px;font-size:15px;font-weight:700;color:var(--ink2)}
.sk.best{background:#FFF3D1;color:#6A4A00}
.sk svg.ic{width:16px;height:16px}
.pess{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.nota{background:var(--atn-soft);color:var(--atn-ink);border-radius:14px;padding:12px 16px;font-size:17px;margin-bottom:16px}
</style>

<script>
/* ================= utilidades ================= */
const MIN=6e4,H=36e5,DIA=864e5;
const DOW=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DOWc=['dom','seg','ter','qua','qui','sex','sáb'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const fD=ts=>{const d=new Date(ts);return `${DOWc[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const fDur=ms=>{const m=Math.max(0,Math.round(ms/MIN));const h=Math.floor(m/60);return h?`${h}h${pad(m%60)}`:`${m} min`};
const nf=(x,d=1)=>Number(x).toLocaleString('pt-BR',{maximumFractionDigits:d});
const sum=a=>a.reduce((x,y)=>x+y,0);
const isWD=d=>d.getDay()!==0&&d.getDay()!==6;
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d};
function addWD(ts,n){const d=sod(ts);let k=Math.abs(n);const s=n<0?-1:1;while(k>0){d.setDate(d.getDate()+s);if(isWD(d))k--}d.setHours(17,0,0,0);return d.getTime()}
function wdUntil(ts){const a=sod(now()),b=sod(ts);let n=0;const d=new Date(a);if(b>=a){while(d<b){d.setDate(d.getDate()+1);if(isWD(d))n++}return n}while(d>b){if(isWD(d))n--;d.setDate(d.getDate()-1)}return n}
const diasDesde=ts=>Math.max(0,Math.floor((now()-ts)/DIA));
let seedN=7;const rnd=()=>{seedN|=0;seedN=seedN+0x6D2B79F5|0;let t=Math.imul(seedN^seedN>>>15,1|seedN);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pick=a=>a.length?a[Math.floor(rnd()*a.length)]:'';
const ic=(id,cls='')=>`<svg class="ic ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const uid=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1e3);

/* ================= cadastros iniciais (conforme conversa com a Martins) ================= */
const GRUPOS=[{id:'corte',nome:'Corte',i:'i-corte'},{id:'pers',nome:'Personalização',i:'i-estampa'},{id:'costura',nome:'Costura',i:'i-maquina'},{id:'acab',nome:'Acabamento',i:'i-caixa'}];
const TIPOS0=[
  {id:'corte',nome:'Mesa de corte',curto:'Corte',grupo:'corte',i:'i-corte',qtd:1},
  {id:'sublimacao',nome:'Mesa de sublimação',curto:'Sublimação',grupo:'pers',i:'i-estampa',qtd:1},
  {id:'estamparia',nome:'Mesa de estamparia',curto:'Estamparia',grupo:'pers',i:'i-estampa',qtd:1},
  {id:'reta',nome:'Reta',grupo:'costura',i:'i-maquina',qtd:5},
  {id:'overlock',nome:'Overlock',grupo:'costura',i:'i-maquina',qtd:5},
  {id:'galoneira',nome:'Galoneira',grupo:'costura',i:'i-maquina',qtd:4},
  {id:'cobregola',nome:'Cobre-gola',grupo:'costura',i:'i-maquina',qtd:1},
  {id:'caseadeira',nome:'Caseadeira',grupo:'costura',i:'i-botao',qtd:1},
  {id:'botoneira',nome:'Botoneira',grupo:'costura',i:'i-botao',qtd:1},
  {id:'arremate',nome:'Mesa de arremate',curto:'Arremate',grupo:'acab',i:'i-lupa',qtd:1},
  {id:'embalagem',nome:'Mesa de embalagem',curto:'Embalagem',grupo:'acab',i:'i-caixa',qtd:1},
  {id:'bordado',nome:'Bordado',grupo:'pers',i:'i-bordado',externo:true},
  {id:'dtf',nome:'DTF',grupo:'pers',i:'i-estampa',externo:true},
];
const PAPEIS={costura:'Costureira',corte:'Cortador',vendas:'Vendedora',compras:'Compras e entregas',pers:'Personalização',acab:'Acabamento'};
const PESSOAS0=[
  {id:'leo',nome:'Léo',papel:'costura',sabe:['reta','overlock','galoneira','cobregola','caseadeira','botoneira'],melhor:['reta']},

  const a=`fill="${f}" stroke="${st}" stroke-width="2.5" stroke-linejoin="round"`,b=`fill="none" stroke="${ln}" stroke-width="2.5" stroke-linecap="round"`;
  let body;

/* ================= mapa de etapas ================= */
const NW=200,NH=104,GX=48,GY=14;
function layout(p){const L=lv(p),cols=[],row={};topo(p).forEach(s=>(cols[L[s.id]]=cols[L[s.id]]||[]).push(s));
  const bar=s=>s.deps.length?sum(s.deps.map(d=>row[d]||0))/s.deps.length:0;
  cols.forEach((c,i)=>{if(i)c.sort((a,b)=>bar(a)-bar(b));c.forEach((s,r)=>row[s.id]=r)});
  const maxR=Math.max(1,...cols.map(c=>c.length)),pos={};
  cols.forEach((c,i)=>{const off=(maxR-c.length)*(NH+GY)/2;c.forEach((s,r)=>pos[s.id]={x:i*(NW+GX),y:off+r*(NH+GY)})});
  return{pos,w:Math.max(NW,cols.length*(NW+GX)-GX),h:maxR*(NH+GY)-GY}}
function ndStatus(l,s,ped){const x=stOf(l,s.id),m=sMap(prod(l.prod));
  if(x.st==='ok')return['ok',`${ic('i-check')}${x.herdado?'Já estava feito':'Feito'+(x.op?' · '+esc(pNome(x.op)):'')}`];
  if(x.st==='and')return['and',`${ic('i-mao')}${esc(pNome(x.op))} · ${esc(unidade(x.maq)?.nome||'')}`];
  if(x.st==='fora'){const d=diasDesde(x.saiu);return['fora',`${ic('i-caminhao')}No fornecedor · ${d} ${d===1?'dia':'dias'}`]}
  if(ready(l,s,ped))return['ready',`${ic('i-seta')}${isExt(s)?'Pronta para levar':'Pode começar'}`];
  const f=s.deps.filter(d=>!done(l,d));
  if(!f.length&&loteFora(l))return['pend','Peças no fornecedor'];
  if(!f.length&&isExt(s))return['pend',!ped.arteEnviada?'Espera enviar a arte':'Espera peças voltarem da máquina'];
  return['pend',f.length?`Espera: ${esc(m[f[0]].nome)}${f.length>1?` e mais ${f.length-1}`:''}`:'Espera liberar o corte']}
function fluxo(p,key,l,ped){const{pos,w,h}=layout(p),m=sMap(p);const sel=ui.fx&&ui.fx.k===key&&m[ui.fx.s]?ui.fx.s:null;
  const rel=sel?new Set([sel,...anc(p,sel),...desc(p,sel)]):null;const mk='ar'+key.replace(/[^a-zA-Z0-9]/g,'');
  const edges=p.steps.flatMap(s=>s.deps.filter(d=>pos[d]&&pos[s.id]).map(d=>{const a=pos[d],b=pos[s.id];const x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2;
    const on=l&&done(l,d),hi=sel&&(d===sel||s.id===sel),dim=rel&&!(rel.has(d)&&rel.has(s.id));
    return `<path class="e ${on?'on':''} ${hi?'hi':''} ${dim?'dim':''}" d="M${x1} ${y1}C${x1+GX*.7} ${y1},${x2-GX*.7} ${y2},${x2-7} ${y2}" marker-end="url(#${mk}${hi?'h':on?'g':''})"/>`}));
  const mark=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
  const nodes=p.steps.filter(s=>pos[s.id]).map(s=>{const q=pos[s.id];let cls,st;
    if(l){const r=ndStatus(l,s,ped);cls='st-'+r[0];st=r[1]}
    else if(isExt(s)){cls='f-ext';st=`${ic('i-caminhao')}Terceirizado`}
    else{const f=fase(p,s);cls='f-'+f;st=f==='antes'?`${ic('i-adiantar')}Pode adiantar`:f==='pers'?`${ic('i-estampa')}Personalização`:s.fecha?`${ic('i-cadeado')}Fecha a peça`:'Depois da personalização'}
    return `<button class="nd ${cls} ${sel===s.id?'sel':''} ${rel&&!rel.has(s.id)?'dim':''}" style="left:${q.x}px;top:${q.y}px;width:${NW}px;height:${NH}px" data-a="fxSel" data-k="${key}" data-s="${s.id}">
      <span class="nd-h">${ic(PICON[s.posto])}<span>${esc(s.nome)}</span></span><span class="nd-m">${esc(tNome(s.posto))}${l||isExt(s)?'':` · ${nf(s.min)} min`}</span><span class="nd-s">${st}</span></button>`}).join('');
  return `<div class="fx-wrap" data-k="${key}"><div class="fx" style="width:${w}px;height:${h}px"><svg class="fx-lines" width="${w}" height="${h}" aria-hidden="true"><defs>${mark(mk,'#A9B3BF')}${mark(mk+'g','#17864A')}${mark(mk+'h','#1E5BB8')}</defs>${edges.join('')}</svg>${nodes}</div></div>
    ${w>700?`<div class="arraste">${ic('i-seta')}Arraste para o lado para ver todas as ${p.steps.length} etapas</div>`:''}
    ${sel?fxInfo(p,m[sel],key,l):`<div class="arraste">${ic('i-mao')}Toque numa etapa para ver o que ela precisa</div>`}`}
function fxInfo(p,s,key,l){const m=sMap(p),fil=filhos(p,s.id),podeTirar=!l&&!fil.length&&p.steps.length>1,chip=id=>`<span class="tagp">${esc(m[id].nome)}</span>`;
  const quem=isExt(s)?fornDe(s.posto).map(f=>f.nome):aptos(s.posto).map(x=>x.nome+((x.melhor.includes(s.nome)||x.melhor.includes(s.posto))?' ★':''));
  return `<div class="fx-info"><div class="t">${ic(PICON[s.posto])}${esc(s.nome)}</div>
    <div>${esc(tipo(s.posto).nome)}${isExt(s)?' · terceirizado':` · ${nf(s.min)} min por peça${l?` · ${esc(fDur(s.min*qtdEf(l)*MIN))} para as ${qtdEf(l)} peças`:''}`}${s.fecha?' · fecha a peça':''}</div>
    <div class="lin"><b>Precisa estar pronto antes:</b>${s.deps.length?s.deps.map(chip).join(''):'<span>nada, é a primeira etapa</span>'}</div>
    <div class="lin"><b>Quando terminar, libera:</b>${fil.length?fil.map(x=>chip(x.id)).join(''):'<span>a peça fica pronta</span>'}</div>
    <div class="lin"><b>${isExt(s)?'Fornecedor:':'Quem sabe fazer:'}</b>${quem.length?quem.map(n=>`<span class="tagp">${esc(n)}</span>`).join(''):'<span style="color:var(--red);font-weight:700">ninguém cadastrado</span>'}</div>
    ${s.obs?`<div class="lin">${ic('i-etiqueta')}<b>${esc(s.obs)}</b></div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap">${podeTirar?`<button class="x" data-a="rmEtapa" data-p="${p.id}" data-s="${s.id}">Tirar esta etapa</button>`:''}<button class="x azul" data-a="fxSel" data-k="${key}" data-s="${s.id}">Fechar</button></div></div>`}
function legendaStatus(){return `<div class="legenda"><span><i style="background:var(--go-soft);border-color:var(--go)"></i>Feito</span><span><i style="background:var(--blue-soft);border:3px solid var(--blue)"></i>Fazendo</span><span><i style="border:3px solid var(--ink)"></i>Pode começar</span><span><i style="background:#F3ECFB;border:3px solid #7A3E9D"></i>No fornecedor</span><span><i style="background:#F5F6F8;border-style:dashed"></i>Esperando</span></div>`}

/* ================= CADASTROS ================= */
function vCadastros(){const tabs=[['maquinas','Máquinas','i-maquina'],['equipe','Equipe','i-pessoas'],['forn','Terceirizados','i-caminhao'],['produtos','Produtos','i-camisa']];

function cMaquinas(){const P=plano();return `<p style="margin:-6px 0 14px;color:var(--ink2)">Cada máquina é um posto de trabalho. Ajuste a quantidade com + e −.</p>
  ${GRUPOS.map(g=>{const ts=state.tipos.filter(t=>t.grupo===g.id&&!t.externo);if(!ts.length)return '';return `<div class="tipo-h">${ic(g.i)}${g.nome}</div>${ts.map(t=>{const ap=aptos(t.id);
    return `<div class="cad-row"><span class="m-ic">${ic(t.i)}</span><div><b>${esc(t.nome)}</b><span>${ap.length?'Sabem usar: '+ap.map(p=>esc(p.nome)+(p.melhor.includes(t.id)?' ★':'')).join(', '):'<b style="color:var(--red);display:inline">Ninguém cadastrado para usar</b>'}</span></div>
      <div class="qtdbox"><button class="stp" data-a="tQtd" data-t="${t.id}" data-d="-1" aria-label="Menos uma ${esc(t.nome)}">−</button><output>${t.qtd}</output><button class="stp" data-a="tQtd" data-t="${t.id}" data-d="1" aria-label="Mais uma ${esc(t.nome)}">+</button></div></div>`}).join('')}`}).join('')}`}
function cEquipe(){const ord=['costura','corte','pers','acab','vendas','compras'];const ps=[...state.pessoas].sort((a,b)=>ord.indexOf(a.papel)-ord.indexOf(b.papel));
  return `<p style="margin:-6px 0 14px;color:var(--ink2)">Toque numa pessoa para mudar o que ela sabe fazer. ★ = faz melhor, o sistema dá preferência.</p>

    <div class="skills">${p.sabe.map(t=>`<span class="sk ${p.melhor.includes(t)?'best':''}">${ic(tipo(t).i)}${esc(tNome(t))}${p.melhor.includes(t)?' ★':''}</span>`).join('')}${p.melhor.filter(x=>!state.tipos.some(t=>t.id===x)).map(x=>`<span class="sk best">${esc(x)} ★</span>`).join('')}${!p.sabe.length?`<span class="sk">${p.papel==='vendas'?'Vias, arte e envio para personalização':p.papel==='compras'?'Compras, levar e buscar terceirizados':'Sem máquina'}</span>`:''}</div></button>`).join('')}

function cForn(){return `<p style="margin:-6px 0 14px;color:var(--ink2)">Serviços feitos fora. O pacote inteiro vai e volta junto.</p>
  <div class="pess">${state.forn.map(f=>`<button class="pes" data-a="fornEd" data-id="${f.id}"><div class="pes-h"><span class="m-ic" style="background:#F3ECFB;color:#6B2F8C">${ic(tipo(f.servico).i)}</span><div><b>${esc(f.nome)}</b><span>${esc(tNome(f.servico))}</span></div></div>
    <div class="skills"><span class="sk">${ic('i-relogio')}Prazo ${f.prazo} ${f.prazo>1?'dias':'dia'}</span><span class="sk">${ic('i-caminhao')}${esc(pNome(f.leva)||'ninguém')}</span></div></button>`).join('')}

function cProdutos(){return `<div class="prods">${state.produtos.map(p=>`<button class="prodc" data-a="produto" data-p="${p.id}">${prodSvg(p.id,'')}<b>${esc(p.nome)}</b><span>${p.steps.length} etapas · ${nf(sum(p.steps.filter(s=>!isExt(s)).map(s=>s.min)))} min por peça</span></button>`).join('')}
  <button class="prodc add" data-a="nprod">${ic('i-mais')}<b>Cadastrar produto</b></button></div>`}
function sPesEd(){const e=ui.sheet,internos=state.tipos.filter(t=>!t.externo);
  const nomesEtapas=[...new Set(state.produtos.flatMap(p=>p.steps.filter(s=>e.sabe.includes(s.posto)).map(s=>s.nome)))];
  return `${voltar('Cancelar')}<h1>${e.id?esc(e.nome||'Pessoa'):'Nova pessoa'}</h1>

  <div class="rotulo">Máquinas que sabe usar</div><div class="escolhe">${internos.map(t=>`<button class="opc" data-a="xSabe" data-v="${t.id}" aria-pressed="${e.sabe.includes(t.id)}">${ic(t.i)}${esc(t.nome)}</button>`).join('')}</div>
  ${e.sabe.length?`<div class="rotulo">Faz melhor ★ <span style="font-weight:400;color:var(--muted)">(o sistema dá preferência)</span></div>
  <div class="linha-dep">${e.sabe.map(t=>`<button class="depc" data-a="xMelhor" data-v="${t}" aria-pressed="${e.melhor.includes(t)}">${ic(tipo(t).i)}${esc(tNome(t))}</button>`).join('')}</div>
  <div class="rotulo" style="font-size:17px">Ou uma etapa específica</div><div class="linha-dep">${nomesEtapas.map(n=>`<button class="depc" data-a="xMelhor" data-v="${esc(n)}" aria-pressed="${e.melhor.includes(n)}">${esc(n)}</button>`).join('')}</div>`:''}

  <div class="acoes"><button class="big go" data-a="xOk">${ic('i-check')}Salvar</button>${e.id?`<button class="big neutro" data-a="xRm">Tirar da equipe</button>`:''}</div>`}
function sFornEd(){const e=ui.sheet,ext=state.tipos.filter(t=>t.externo);
  return `${voltar('Cancelar')}<h1>${e.id?esc(e.nome):'Novo terceirizado'}</h1>
  <div class="rotulo">Nome do fornecedor</div><input class="campo" id="xNome" value="${esc(e.nome)}" autocomplete="off">
  <div class="rotulo">Serviço</div><div class="escolhe">${ext.map(t=>`<button class="opc" data-a="fServ" data-v="${t.id}" aria-pressed="${e.servico===t.id}">${ic(t.i)}${esc(t.nome)}</button>`).join('')}</div>
  <div class="rotulo">Prazo (dias)</div><div class="contador" style="justify-content:flex-start"><button class="stp" data-a="fPrazo" data-d="-1" aria-label="Menos um dia">−</button><output>${e.prazo}</output><button class="stp" data-a="fPrazo" data-d="1" aria-label="Mais um dia">+</button></div>
  <div class="rotulo">Quem leva e busca</div><div class="linha-dep">${state.pessoas.map(p=>`<button class="pchip" data-a="fLeva" data-v="${p.id}" aria-pressed="${e.leva===p.id}">${av(p.id,'s')}${esc(p.nome)}</button>`).join('')}</div>
  ${e.err?`<div class="aviso">${ic('i-alerta')}${esc(e.err)}</div>`:''}
  <div class="acoes"><button class="big go" data-a="fOk">${ic('i-check')}Salvar</button></div>`}
function sProduto(pid){const p=prod(pid);if(!p)return voltar();const key='P'+p.id;
  const porMaq=state.tipos.map(t=>({t,ss:p.steps.filter(s=>s.posto===t.id)})).filter(x=>x.ss.length);
  return `${voltar()}<div class="card"><div class="item-h">${prodSvg(p.id,'')}<div style="margin-right:auto"><h1 style="margin:0">${esc(p.nome)}</h1><div style="color:var(--ink2)">${esc(p.tecido)} · ${p.steps.length} etapas</div></div></div></div>
  <div class="card"><h2>Como é feita</h2><p style="margin:0 0 4px;color:var(--ink2)">Siga as setas: cada etapa só começa quando as que chegam nela terminam.</p>
    <div class="legenda"><span><i></i><b style="color:var(--go-dark)">Pode adiantar</b></span><span><i style="background:var(--atn-soft);border-color:var(--atn)"></i>Personalização interna</span><span><i style="background:#F3ECFB;border-color:#B48ACB"></i>Terceirizado</span><span><i></i>Depois da personalização</span></div>
    ${fluxo(p,key)}<div class="acoes"><button class="big azul" data-a="addEtapa" data-p="${p.id}">${ic('i-mais')}Adicionar etapa</button></div></div>
  <div class="card"><h2>Etapas por máquina</h2>${porMaq.map(x=>`<div class="mat">${ic(x.t.i)}<div><b>${esc(x.t.nome)}</b><span>${x.ss.map(s=>esc(s.nome)).join(' · ')}</span></div><span class="tagp">${x.t.externo?'fora':nf(sum(x.ss.map(s=>s.min)))+' min'}</span></div>`).join('')}</div>`}
function eRead(){const e=ui.sheet;[['eNome','nome'],['eObs','obs'],['pNome','nome'],['pTec','tecido'],['xNome','nome']].forEach(([id,k])=>{const n=document.getElementById(id);if(n)e[k]=n.value})}
function sEtapa(){const e=ui.sheet,p=prod(e.p);
  return `${voltar('Cancelar')}<h1>Nova etapa em ${esc(p.nome)}</h1>
  <div class="rotulo">Nome da etapa</div><input class="campo" id="eNome" value="${esc(e.nome)}" placeholder="Ex.: Pregar vivo na gola" autocomplete="off">
  <div class="rotulo">Onde é feita?</div><div class="escolhe">${state.tipos.map(t=>`<button class="opc" data-a="eP" data-v="${t.id}" aria-pressed="${e.posto===t.id}">${ic(t.i)}${esc(t.nome)}${t.externo?'<span style="font-weight:400;font-size:15px;color:#6B2F8C">terceirizado</span>':''}</button>`).join('')}</div>
  <div class="rotulo">O que precisa estar pronto antes?</div><div class="linha-dep">${topo(p).map(s=>`<button class="depc" data-a="eD" data-v="${s.id}" aria-pressed="${e.deps.includes(s.id)}">${ic(PICON[s.posto])}${esc(s.nome)}</button>`).join('')}</div>
  <div class="rotulo">Tempo por peça (minutos)</div><div class="contador" style="justify-content:flex-start"><button class="stp" data-a="eM" data-d="-0.1" aria-label="Menos tempo">−</button><output>${nf(e.min)}</output><button class="stp" data-a="eM" data-d="0.1" aria-label="Mais tempo">+</button></div>

/* ================= FOLHAS ================= */
const voltar=(lab='Voltar')=>`<button class="voltar" data-a="fechar">${ic('i-voltar')}${lab}</button>`;
function sMaq(){const e=ui.sheet,u=unidade(e.m);if(!u)return voltar();const P=plano(),t=P.uso[u.id],tp=tipo(u.tipo);
  const head=`<div class="quem"><span class="m-ic" style="width:64px;height:64px">${ic(tp.i)}</span><div><b>${esc(u.nome)}</b><span>Sabem usar: ${aptos(u.tipo).map(p=>esc(p.nome)).join(', ')||'ninguém'}</span></div></div>`;
  if(t)return `${voltar()}${head}<h2>${av(t.x.op,'s')} ${esc(pNome(t.x.op))} está fazendo</h2>${tarefaCard(t)}
    <div class="acoes"><button class="big go" data-a="terminou" data-m="${u.id}">${ic('i-check')}Terminou</button><button class="big prob" data-a="problema" data-m="${u.id}">${ic('i-alerta')}Deu problema</button></div>`;
  const feito=e.feito?`<div class="feito"><div class="ok">${ic('i-check')}</div><b>Pronto!</b><span>${esc(e.feito)}</span></div>`:'';
  const tasks=prontas().filter(it=>it.s.posto===u.tipo&&!Object.values(P.plan).some(x=>x!==P.plan[u.id]&&x.l.id===it.l.id&&x.s.id===it.s.id));
  if(!tasks.length)return `${voltar(e.feito?'Fechar':'Voltar')}${head}${feito}<div class="vazio-box">${ic('i-dormir')}<b>Nada para ${esc(tp.nome)} agora</b></div>`;
  const pl=P.plan[u.id],sel=e.sel!=null?tasks[e.sel]||tasks[0]:(pl?tasks.find(x=>x.l.id===pl.l.id&&x.s.id===pl.s.id):null)||tasks[0];
  const livres=aptos(u.tipo).filter(p=>!P.ocup.has(p.id)).sort((a,b)=>nota(b,sel)-nota(a,sel));
  const quem=e.p&&livres.some(p=>p.id===e.p)?e.p:(pl&&sel===tasks.find(x=>x.l.id===pl.l.id&&x.s.id===pl.s.id)?pl.pessoa:livres[0]?.id);
  return `${voltar(e.feito?'Fechar':'Voltar')}${head}${feito}<h2>Próximo trabalho</h2>${tarefaCard(sel,true)}
    <div class="rotulo">Quem vai fazer?</div>
    ${livres.length?`<div class="linha-dep">${livres.map(p=>`<button class="pchip" data-a="mP" data-v="${p.id}" aria-pressed="${quem===p.id}">${av(p.id,'s')}${esc(p.nome)} ${estrela(p,sel)}</button>`).join('')}</div>
    <div class="acoes"><button class="big go ini" data-a="comecar" data-m="${u.id}" data-l="${sel.l.id}" data-s="${sel.s.id}" data-p="${quem}">${ic('i-play')}Começar com ${esc(pNome(quem))}</button></div>`
    :`<div class="vazio-box">${ic('i-pessoas')}<b>Ninguém livre sabe usar esta máquina</b><button class="mbtn" data-a="irEquipe">Ver cadastro da equipe</button></div>`}
    ${tasks.length>1?`<h2 style="margin-top:26px">Ou escolher outro</h2><div class="outras">${tasks.slice(0,5).map((it,k)=>it===sel?'':`<button class="outra" data-a="mT" data-v="${k}">${prodSvg(it.p.id,it.l.cor)}<div><b>${esc(it.s.nome)} · ${qtdEf(it.l)} peças</b><span>${esc(it.ped.cliente)}</span></div><span class="ir">Escolher${ic('i-seta')}</span></button>`).join('')}</div>`:''}`}
function tarefaNa(m){return plano().uso[m]||null}
function sProblema(){const m=ui.sheet,t=tarefaNa(m.m);if(!t)return voltar();const passos=`<div class="passos">${[1,2,3].map(n=>`<i class="${n<=m.step?'on':''}"></i>`).join('')}</div>`;
  const head=`${voltar(m.step>1?'Voltar':'Cancelar')}${passos}`;
  if(m.step===1)return `${head}<h1>Qual foi o problema?</h1><div class="probs">${PROBS.map((p,k)=>`<button class="opc" data-a="pMot" data-k="${k}">${ic(p.i)}${p.k}</button>`).join('')}</div>`;
  if(m.step===2)return `${head}<h1>Quantas peças?</h1><div class="contador"><button class="stp" data-a="pN" data-d="-1" aria-label="Menos uma">−</button><output>${m.n}</output><button class="stp" data-a="pN" data-d="1" aria-label="Mais uma">+</button></div><p style="text-align:center;color:var(--muted)">de ${qtdEf(t.l)} peças</p><div class="acoes"><button class="big go" data-a="pNext">Continuar${ic('i-seta')}</button></div>`;
  const opts=topo(t.p).filter(s=>(s.id===t.s.id||anc(t.p,t.s.id).has(s.id))&&s.posto!=='corte').reverse();
  return `${head}<h1>Voltar para qual etapa?</h1><div class="escolhe">${opts.map(s=>`<button class="opc" data-a="pOrig" data-s="${s.id}" aria-pressed="${m.orig===s.id}">${ic(PICON[s.posto])}${esc(s.nome)}<span style="font-weight:400;font-size:16px;color:var(--muted)">${esc(tNome(s.posto))}</span></button>`).join('')}</div>
    <div class="acoes"><button class="big go" data-a="pOk" ${m.orig?'':'disabled'}>${ic('i-check')}Mandar ${m.n} ${m.n>1?'peças':'peça'} para conserto</button></div>`}
function sPedidoWrap(id){return sPedido(id)}
function sNovo(){const w=ui.sheet.w,passos=`<div class="passos">${[1,2,3,4].map(n=>`<i class="${n<=w.step?'on':''}"></i>`).join('')}</div>`;
  const head=`${voltar(w.step>1?'Voltar':'Cancelar')}${passos}<div class="passo-n">Passo ${w.step} de 4</div>`;
  const nav=(lab='Próximo')=>`${w.err?`<div class="aviso">${ic('i-alerta')}${esc(w.err)}</div>`:''}<div class="acoes"><button class="big go" data-a="wNext">${lab}${ic('i-seta')}</button></div>`;
  if(w.step===1)return `${head}<h1>Para quem é o pedido?</h1><input class="campo" id="wCli" value="${esc(w.cliente)}" placeholder="Nome do cliente" autocomplete="off">
    <div class="rotulo">Quem vendeu?</div><div class="linha-dep">${state.pessoas.filter(p=>p.papel==='vendas').map(p=>`<button class="pchip" data-a="wVend" data-v="${p.id}" aria-pressed="${w.vend===p.id}">${av(p.id,'s')}${esc(p.nome)}</button>`).join('')}</div>${nav()}`;
  if(w.step===2)return `${head}<h1>Quais peças?</h1><p style="color:var(--ink2);margin-top:-6px">Toque na peça para adicionar.</p><div class="escolhe">${state.produtos.map(p=>`<button class="opc" data-a="wAdd" data-p="${p.id}">${prodSvg(p.id,'')}${esc(p.nome)}</button>`).join('')}</div>
    ${w.itens.map((it,k)=>`<div class="item"><div class="item-h">${prodSvg(it.prod,it.cor)}<b>${esc(prod(it.prod).nome)}</b><button class="x" data-a="wRm" data-k="${k}">Tirar</button></div>
      <div><div class="passo-n">Cor</div><div class="cores">${Object.entries(CORES).map(([n,h])=>`<button class="cor" data-a="wCor" data-k="${k}" data-c="${n}" aria-pressed="${it.cor===n}"><span style="background:${h}"></span>${n}</button>`).join('')}</div></div>
      <div><div class="passo-n">Quantidade por tamanho</div><div class="tams">${SIZES.map(s=>`<div class="tam"><b>${s}</b><button class="stp" data-a="wQ" data-k="${k}" data-s="${s}" data-d="-10" aria-label="Menos 10 no ${s}">−</button><input id="q${k}${s}" data-q="${k}" data-s="${s}" inputmode="numeric" value="${it.g[s]||0}" aria-label="Quantidade ${s}"><button class="stp" data-a="wQ" data-k="${k}" data-s="${s}" data-d="10" aria-label="Mais 10 no ${s}">+</button></div>`).join('')}</div>
      <p style="margin:0;font-weight:700">Total: ${sum(SIZES.map(s=>it.g[s]||0))} peças</p></div>`).join('')}${nav()}`;
  if(w.step===3){const ops=[15,20,30].map(d=>{const dt=new Date(now()+d*DIA);dt.setHours(17,0,0,0);return dt.getTime()});
    const iso=w.entrega?(()=>{const d=new Date(w.entrega);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`})():'';
    return `${head}<h1>Para quando?</h1><div class="datas">${ops.map((t,k)=>`<button class="data-op" data-a="wData" data-t="${t}" aria-pressed="${w.entrega===t}"><b>Daqui ${[15,20,30][k]} dias</b><span>${DOW[new Date(t).getDay()]}, ${new Date(t).getDate()} de ${MES[new Date(t).getMonth()]}</span></button>`).join('')}</div>
      <p class="passo-n" style="margin-top:18px">Ou escolha outra data</p><input class="campo" type="date" id="wDt" value="${iso}">${nav()}`}
  const tot=sum(w.itens.map(it=>sum(SIZES.map(s=>it.g[s]||0))));
  const mats=calcMat(w.itens.map(it=>({prod:it.prod,cor:it.cor,qtd:sum(SIZES.map(s=>it.g[s]||0))}))).filter(m=>m.st==='comprar');
  return `${head}<h1>Está certo?</h1><div class="card"><h2>${esc(w.cliente)}</h2><div class="ped-ent">${av(w.vend,'s')}Vendedora: <b>${esc(pNome(w.vend))}</b></div>
    ${w.itens.map(it=>`<div class="resumo-item">${prodSvg(it.prod,it.cor)}<div><b>${esc(prod(it.prod).nome)} ${esc(it.cor)}</b><div style="color:var(--ink2)">${SIZES.filter(s=>it.g[s]).map(s=>`${s}: ${it.g[s]}`).join(' · ')}</div></div></div>`).join('')}
    <div class="resumo-item">${ic('i-caminhao')}<b>Entrega ${DOW[new Date(w.entrega).getDay()]}, ${new Date(w.entrega).getDate()} de ${MES[new Date(w.entrega).getMonth()]} · ${tot} peças</b></div></div>
    <div class="card"><h2>${mats.length?'Vai precisar comprar':'Tem todo o material'}</h2>${mats.length?mats.map(m=>`<div class="mat">${ic('i-carrinho')}<div><b>${esc(m.item)}</b><span>${qtdTxt(m.nec-m.est,m.un)}</span></div><span></span></div>`).join(''):`<div class="lib u-ok">${ic('i-check')}Pode seguir</div>`}</div>
    <div class="acoes"><button class="big go" data-a="wCriar">${ic('i-check')}Criar pedido</button></div>`}
function sAjuda(){return `${voltar('Fechar')}<h1>Como usar</h1><div class="ajuda">
  <div class="aj"><span class="n">1</span>${ic('i-maquina')}<b>Cada cartão é uma máquina</b></div>
  <div class="aj"><span class="n">2</span>${ic('i-play')}<b>Máquina parada? Aperte COMEÇAR</b></div>
  <div class="aj"><span class="n">3</span>${ic('i-check')}<b>Acabou? Aperte TERMINOU</b></div></div>
  <div class="ajuda"><div class="aj">${ic('i-alerta')}<b>Peça com defeito? Toque na máquina e aperte DEU PROBLEMA</b></div><div class="aj">${ic('i-conserto')}<b>Apertou errado? Aperte DESFAZER</b></div></div>
  <div class="acoes"><button class="big go" data-a="fechar">Entendi</button></div>`}

/* ================= render ================= */
const sheetId=s=>s.t+':'+(s.id||s.p||s.m||'');
function render(){
  document.querySelectorAll('.nb[data-t]').forEach(b=>b.setAttribute('aria-current',b.dataset.t===ui.tela?'page':'false'));
  document.getElementById('app').innerHTML=ui.tela==='pedidos'?vPedidos():ui.tela==='cadastros'?vCadastros():vFabrica();
  const sh=document.getElementById('sheet');const s=ui.sheet;
  if(!s){sh.innerHTML='';document.body.style.overflow='';return}
  const old=sh.querySelector('.sheet'),keep=old&&old.dataset.id===sheetId(s)?{top:old.scrollTop,x:[...old.querySelectorAll('.fx-wrap')].map(e=>[e.dataset.k,e.scrollLeft])}:null;
  const html=({maq:sMaq,pedido:()=>sPedido(s.id),prob:sProblema,novo:sNovo,ajuda:sAjuda,produto:()=>sProduto(s.p),etapa:sEtapa,nprod:sNovoProd,pes:sPesEd,forn:sFornEd}[s.t]||(()=>''))();
  sh.innerHTML=`<div class="sheet ${['pedido','produto'].includes(s.t)?'largo':''}" data-id="${esc(sheetId(s))}" role="dialog" aria-modal="true"><div class="wrap">${html}</div></div>`;document.body.style.overflow='hidden';
  if(keep){const n=sh.querySelector('.sheet');n.scrollTop=keep.top;keep.x.forEach(([k,x])=>{const e=n.querySelector(`.fx-wrap[data-k="${k}"]`);if(e)e.scrollLeft=x})}
  const f=document.getElementById('wCli');if(f&&!f.value)f.focus()}
function snap(){undo=JSON.stringify(state)}
function toast(msg,comDesfazer=true){const el=document.getElementById('toast');clearTimeout(toastT);
  el.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${comDesfazer?'<button data-a="desfazer">Desfazer</button>':''}</div>`;toastT=setTimeout(()=>{el.innerHTML='';undo=null},9000)}
function commit(){save();render()}
function openSheet(s){ui.sheet=s;render();const e=document.querySelector('.sheet');if(e)e.scrollTop=0}
function wRead(){const w=ui.sheet?.w;if(!w)return;const c=document.getElementById('wCli');if(c)w.cliente=c.value;
  document.querySelectorAll('[data-q]').forEach(i=>{w.itens[+i.dataset.q].g[i.dataset.s]=Math.max(0,parseInt(i.value)||0)});
  const d=document.getElementById('wDt');if(d&&d.value){const[y,m,dd]=d.value.split('-').map(Number);w.entrega=new Date(y,m-1,dd,17).getTime()}}
const togl=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
const A={
  tela:d=>{ui.tela=d.t;ui.sheet=null;render();window.scrollTo(0,0)},
  cad:d=>{ui.cad=d.k;render()},
  irEquipe:()=>{ui.tela='cadastros';ui.cad='equipe';ui.sheet=null;render();window.scrollTo(0,0)},
  fechar:()=>{const s=ui.sheet;if(s?.t==='etapa'){ui.sheet={t:'produto',p:s.p};return render()}if(s?.t==='prob'&&s.step>1){s.step--;return render()}if(s?.t==='novo'&&s.w.step>1){wRead();s.w.step--;s.w.err='';return render()}ui.sheet=null;render()},
  ajuda:()=>openSheet({t:'ajuda'}),
  maq:d=>openSheet({t:'maq',m:d.m}),
  mP:d=>{ui.sheet.p=d.v;render()},
  mT:d=>{ui.sheet.sel=+d.v;ui.sheet.p=null;render()},
  pedido:d=>{ui.fx=null;openSheet({t:'pedido',id:d.id})},
  terminou:d=>{const t=tarefaNa(d.m);if(!t)return;snap();t.x.st='ok';t.x.fim=now();save();const n=`${pNome(t.x.op)} terminou ${t.s.nome}`;openSheet({t:'maq',m:d.m,feito:n});toast(n)},
  comecar:d=>{if(!d.p)return;const l=lote(d.l);snap();const s=sMap(prod(l.prod))[d.s];l.steps[d.s]={st:'and',ini:now(),op:d.p,maq:d.m};ui.sheet=null;commit();toast(`${pNome(d.p)} começou ${s.nome} na ${unidade(d.m)?.nome||''}`)},
  desfazer:()=>{if(!undo)return;state=JSON.parse(undo);undo=null;document.getElementById('toast').innerHTML='';ui.sheet=null;commit()},
  problema:d=>openSheet({t:'prob',m:d.m,step:1,n:1,orig:null,mot:null}),
  pMot:d=>{const s=ui.sheet,t=tarefaNa(s.m),pr=PROBS[+d.k];s.mot=pr.k;const opts=topo(t.p).filter(x=>(x.id===t.s.id||anc(t.p,t.s.id).has(x.id))&&x.posto!=='corte').map(x=>x.id);s.orig=pr.alvo.find(a=>opts.includes(a))||t.s.id;s.step=2;render()},
  pN:d=>{const s=ui.sheet,t=tarefaNa(s.m);s.n=Math.min(qtdEf(t.l),Math.max(1,s.n+(+d.d)));render()},
  pNext:()=>{ui.sheet.step=3;render()},
  pOrig:d=>{ui.sheet.orig=d.s;render()},
  pOk:()=>{const s=ui.sheet,t=tarefaNa(s.m);if(!s.orig)return;snap();makeRework(t.l,t.s.id,s.orig,s.n,s.mot,now(),t.x.op);const nome=sMap(t.p)[s.orig].nome;ui.sheet={t:'maq',m:s.m};commit();toast(`${s.n} ${s.n>1?'peças foram':'peça foi'} para conserto em ${nome}`)},
  vias:d=>{const p=pedById(d.id);snap();p.vias=!p.vias;commit();if(p.vias)toast('Vias separadas')},
  arte:d=>{const p=pedById(d.id);snap();p.arte=!p.arte;commit();if(p.arte)toast('Arte aprovada')},
  arteEnv:d=>{const p=pedById(d.id);snap();p.arteEnviada=!p.arteEnviada;commit();if(p.arteEnviada)toast('Arte enviada')},
  comprei:d=>{const p=pedById(d.id);snap();p.materiais[+d.k].st='pedido';commit();toast('Compra anotada')},
  chegou:d=>{const p=pedById(d.id);snap();p.materiais[+d.k].st='recebido';commit();toast('Material chegou')},
  levei:d=>{const l=lote(d.l),s=sMap(prod(l.prod))[d.s],f=fornDe(s.posto)[0];snap();l.steps[s.id]={st:'fora',saiu:now(),forn:f?.id,op:f?.leva};commit();toast(`${qtdEf(l)} peças foram para ${f?.nome||tNome(s.posto)}`)},
  buscou:d=>{const l=lote(d.l),x=l.steps[d.s];snap();x.st='ok';x.fim=now();commit();toast('Peças de volta na fábrica')},
  entregar:d=>{const p=pedById(d.id);snap();p.concluido=now();commit();toast(`Pedido de ${p.cliente} entregue`)},
  /* cadastros */
  tQtd:d=>{const t=tipo(d.t),n=Math.max(0,(t.qtd||0)+(+d.d));if(n<t.qtd&&plano().uso[`${t.id}-${t.qtd}`]){toast(`A ${t.nome} ${t.qtd} está em uso agora`,false);return}snap();t.qtd=n;commit()},
  pesEd:d=>{const p=pessoa(d.id);openSheet(p?{t:'pes',id:p.id,nome:p.nome,papel:p.papel,sabe:[...p.sabe],melhor:[...p.melhor],err:''}:{t:'pes',id:null,nome:'',papel:'costura',sabe:[],melhor:[],err:''})},
  xPapel:d=>{eRead();ui.sheet.papel=d.v;render()},
  xSabe:d=>{eRead();const e=ui.sheet;togl(e.sabe,d.v);if(!e.sabe.includes(d.v))e.melhor=e.melhor.filter(x=>x!==d.v);render()},
  xMelhor:d=>{eRead();togl(ui.sheet.melhor,d.v);render()},
  xOk:()=>{eRead();const e=ui.sheet;if(!e.nome.trim()){e.err='Escreva o nome';return render()}snap();
    const obj={id:e.id||uid('p'),nome:e.nome.trim(),papel:e.papel,sabe:e.sabe,melhor:e.melhor};const i=state.pessoas.findIndex(p=>p.id===e.id);i<0?state.pessoas.push(obj):state.pessoas[i]=obj;ui.sheet=null;commit();toast(`${obj.nome} salvo`)},
  xRm:()=>{const e=ui.sheet;if(plano().ocup.has(e.id)){e.err='Esta pessoa está trabalhando agora. Termine antes de tirar.';return render()}snap();state.pessoas=state.pessoas.filter(p=>p.id!==e.id);ui.sheet=null;commit();toast(`${e.nome} saiu da equipe`)},
  fornEd:d=>{const f=fornById(d.id);openSheet(f?{t:'forn',...JSON.parse(JSON.stringify(f)),err:''}:{t:'forn',id:null,nome:'',servico:'bordado',prazo:3,leva:state.pessoas.find(p=>p.papel==='compras')?.id||'',err:''})},
  fServ:d=>{eRead();ui.sheet.servico=d.v;render()},
  fPrazo:d=>{eRead();ui.sheet.prazo=Math.max(1,ui.sheet.prazo+(+d.d));render()},
  fLeva:d=>{eRead();ui.sheet.leva=d.v;render()},
  fOk:()=>{eRead();const e=ui.sheet;if(!e.nome.trim()){e.err='Escreva o nome do fornecedor';return render()}snap();
    const obj={id:e.id||uid('f'),nome:e.nome.trim(),servico:e.servico,prazo:e.prazo,leva:e.leva};const i=state.forn.findIndex(f=>f.id===e.id);i<0?state.forn.push(obj):state.forn[i]=obj;ui.sheet=null;commit();toast(`${obj.nome} salvo`)},
  fxSel:d=>{ui.fx=ui.fx&&ui.fx.k===d.k&&ui.fx.s===d.s?null:{k:d.k,s:d.s};render()},
  produto:d=>{ui.fx=null;openSheet({t:'produto',p:d.p})},
  addEtapa:d=>openSheet({t:'etapa',p:d.p,nome:'',posto:null,deps:[],min:0.5,pers:false,fecha:false,obs:'',err:''}),
  eP:d=>{eRead();ui.sheet.posto=d.v;render()},
  eD:d=>{eRead();togl(ui.sheet.deps,d.v);render()},
  eM:d=>{eRead();ui.sheet.min=Math.max(0.1,Math.round((ui.sheet.min+(+d.d))*10)/10);render()},
  eT:d=>{eRead();ui.sheet[d.v]=!ui.sheet[d.v];render()},
  eOk:()=>{eRead();const e=ui.sheet,p=prod(e.p);e.err='';
    if(!e.nome.trim())e.err='Escreva o nome da etapa';else if(!e.posto)e.err='Escolha onde é feita';else if(!e.deps.length)e.err='Escolha o que precisa estar pronto antes';
    if(e.err)return render();snap();const base=e.nome.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'')||'etapa';let id=base,k=2;while(p.steps.some(s=>s.id===id))id=base+k++;
    p.steps.push(S(id,e.nome.trim(),e.posto,[...e.deps],e.min,{pers:e.pers||tipo(e.posto).grupo==='pers',fecha:e.fecha,obs:(e.obs||'').trim()}));ui.fx={k:'P'+p.id,s:id};ui.sheet={t:'produto',p:p.id};commit();toast(`Etapa ${e.nome.trim()} adicionada`)},
  rmEtapa:d=>{const p=prod(d.p);if(filhos(p,d.s).length)return;snap();const n=sMap(p)[d.s].nome;p.steps=p.steps.filter(s=>s.id!==d.s);ui.fx=null;commit();toast(`Etapa ${n} tirada`)},
  nprod:()=>openSheet({t:'nprod',nome:'',forma:'camiseta',tecido:'',copia:null,err:''}),
  npF:d=>{eRead();ui.sheet.forma=d.v;render()},
  npC:d=>{eRead();ui.sheet.copia=d.v||null;render()},
  npOk:()=>{eRead();const e=ui.sheet;e.err='';if(!e.nome.trim()){e.err='Escreva o nome do produto';return render()}snap();
    const src=e.copia&&prod(e.copia),id=uid('p');
    state.produtos.push({id,nome:e.nome.trim(),forma:e.forma,tecido:(e.tecido||'').trim()||'Tecido',consumo:src?src.consumo:0.4,aviam:src?JSON.parse(JSON.stringify(src.aviam)):[['Etiqueta','un',1]],steps:src?JSON.parse(JSON.stringify(src.steps)):[S('corte','Corte','corte',[],0.8)]});
    ui.tela='cadastros';ui.cad='produtos';ui.fx=null;ui.sheet={t:'produto',p:id};commit();toast(`${e.nome.trim()} cadastrado`)},
  /* novo pedido */
  novo:()=>openSheet({t:'novo',w:{step:1,cliente:'',vend:null,itens:[],entrega:null,err:''}}),
  wVend:d=>{wRead();ui.sheet.w.vend=d.v;ui.sheet.w.err='';render()},
  wAdd:d=>{wRead();ui.sheet.w.itens.push({prod:d.p,cor:'',g:{}});ui.sheet.w.err='';render();const it=document.querySelectorAll('.item');it[it.length-1]?.scrollIntoView({behavior:'smooth',block:'start'})},
  wRm:d=>{wRead();ui.sheet.w.itens.splice(+d.k,1);render()},
  wCor:d=>{wRead();ui.sheet.w.itens[+d.k].cor=d.c;render()},
  wQ:d=>{wRead();const g=ui.sheet.w.itens[+d.k].g;g[d.s]=Math.max(0,(g[d.s]||0)+(+d.d));render()},
  wData:d=>{ui.sheet.w.entrega=+d.t;ui.sheet.w.err='';render()},
  wNext:()=>{wRead();const w=ui.sheet.w;w.err='';
    if(w.step===1){if(!w.cliente.trim())w.err='Escreva o nome do cliente';else if(!w.vend)w.err='Escolha quem vendeu'}
    if(w.step===2){if(!w.itens.length)w.err='Toque em uma peça para adicionar';else if(w.itens.some(i=>!i.cor))w.err='Escolha a cor de cada peça';else if(w.itens.some(i=>!sum(SIZES.map(s=>i.g[s]||0))))w.err='Coloque a quantidade de cada peça'}
    if(w.step===3&&!w.entrega)w.err='Escolha a data de entrega';
    if(!w.err)w.step++;render();const e=document.querySelector('.sheet');if(e&&!w.err)e.scrollTop=0},
  wCriar:()=>{const w=ui.sheet.w;snap();const id=String(state.seq++).padStart(4,'0');const lines=w.itens.map(it=>({prod:it.prod,cor:it.cor,g:{...it.g},qtd:sum(SIZES.map(s=>it.g[s]||0))}));
    state.pedidos.push({id,cliente:w.cliente.trim(),vendedor:w.vend,chegada:now(),entrega:w.entrega,vias:false,arte:false,arteEnviada:false,materiais:calcMat(lines),concluido:null});
    lines.forEach((x,i)=>state.lotes.push({id:`${id}-${i+1}`,ped:id,prod:x.prod,cor:x.cor,qtd:x.qtd,grade:x.g,desm:0,steps:{},rework:false,parent:null}));
    ui.tela='pedidos';ui.sheet={t:'pedido',id};commit();toast('Pedido criado')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b.dataset)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)A.fechar();if(e.key==='Enter'&&['eNome','eObs','pNome','pTec','xNome'].includes(e.target.id))e.preventDefault();if(e.key==='Enter'&&e.target.id==='wCli'){e.preventDefault();A.wNext()}});
function tick(){const h=new Date().getHours();document.getElementById('ola').textContent=`${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}, Helena`;
  const d=new Date();document.getElementById('hoje').textContent=`${DOW[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]}`;
  document.querySelectorAll('[data-ini]').forEach(el=>el.textContent=fDur(now()-(+el.dataset.ini)))}
load();render();tick();setInterval(tick,30000);
try{if(!localStorage.getItem(KEY+'-ajuda')){localStorage.setItem(KEY+'-ajuda','1');openSheet({t:'ajuda'})}}catch(e){}
</script>
